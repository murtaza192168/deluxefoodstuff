    <style>
      /* Instant branded loader: visible before any JavaScript arrives */
      #splash{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:#FAF8F3;transition:opacity .45s ease,visibility .45s ease}
      #splash.gone{opacity:0;visibility:hidden}
      .dl-box{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
      .dl-logo{width:76px;height:76px;margin-bottom:14px;animation:dl-breathe 2.4s ease-in-out infinite}
      .dl-name{font:600 30px/1.1 "Cormorant Garamond",Georgia,serif;color:#1C2621;letter-spacing:.01em}
      .dl-tag{font:500 11px/1 Inter,system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#8A8274;margin-top:10px}
      .dl-icons{display:flex;gap:22px;margin-top:30px;color:#C9C1B1}
      .dl-icons svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;animation:dl-pick 2s ease-in-out infinite}
      .dl-icons svg:nth-child(2){animation-delay:.25s}.dl-icons svg:nth-child(3){animation-delay:.5s}
      .dl-icons svg:nth-child(4){animation-delay:.75s}.dl-icons svg:nth-child(5){animation-delay:1s}
      .dl-line{width:150px;height:1px;background:#E6DFD1;margin-top:26px;position:relative;overflow:hidden}
      .dl-line:after{content:"";position:absolute;inset:0;width:40%;background:#B8913F;animation:dl-sweep 1.4s ease-in-out infinite}
      .dl-inline{min-height:70vh;display:flex;align-items:center;justify-content:center}
      @keyframes dl-pick{0%,55%,100%{color:#C9C1B1;transform:translateY(0)}20%{color:#B8913F;transform:translateY(-7px)}}
      @keyframes dl-sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @keyframes dl-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      /* Scroll reveals and image fade-in (driven by src/motion/ScrollReveal.jsx) */
      [data-reveal=""]{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--rv-i,0) * 80ms)}
      [data-reveal=""].rv-in{opacity:1;transform:none}
      img.img-fade{opacity:0;transition:opacity .6s ease}
      img.img-fade.img-in{opacity:1}
      /* "Added to enquiry" feedback */
      .dl-bump{display:inline-flex;animation:dl-bump .65s cubic-bezier(.3,1.5,.5,1)}
      .dl-bump .MuiBadge-badge{animation:dl-ring .9s ease-out}
      .dl-tick{display:inline-flex;animation:dl-tick .45s cubic-bezier(.3,1.6,.5,1)}
      .dl-rise{animation:dl-rise .45s cubic-bezier(.2,.8,.2,1)}
      @keyframes dl-rise{from{transform:translateY(130%)}to{transform:none}}
      @keyframes dl-bump{0%{transform:none}30%{transform:scale(1.22) rotate(-8deg)}60%{transform:scale(.96) rotate(3deg)}100%{transform:none}}
      @keyframes dl-ring{0%{box-shadow:0 0 0 0 rgba(184,145,63,.55)}100%{box-shadow:0 0 0 12px rgba(184,145,63,0)}}
      @keyframes dl-tick{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
      @media print{[data-reveal],img.img-fade{opacity:1!important;transform:none!important}}
      @media (prefers-reduced-motion:reduce){img.img-fade{transition:none}.dl-bump,.dl-bump .MuiBadge-badge,.dl-tick,.dl-rise{animation:none}.dl-icons svg,.dl-line:after,.dl-logo{animation:none}}
    </style>
